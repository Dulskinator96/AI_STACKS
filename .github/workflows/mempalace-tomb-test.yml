name: MemPalace real LLM tomb experiment

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "experiments/mempalace/**"
      - ".github/workflows/mempalace-tomb-test.yml"
  push:
    branches:
      - experiment/mempalace-tomb-memory-v1
    paths:
      - "experiments/mempalace/**"
      - ".github/workflows/mempalace-tomb-test.yml"

permissions:
  contents: read

concurrency:
  group: mempalace-stage1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-model-stage1:
    if: github.repository == 'Dulskinator96/AI_STACKS'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Check out exact test revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate test harness without fake inference
        run: |
          python -m py_compile experiments/mempalace/tomb_relocation.py experiments/mempalace/knowledge_collaboration.py
          python -m unittest discover -s experiments/mempalace -p "test_*.py" -v
      - name: Install original MemPalace
        run: |
          python -m pip install --disable-pip-version-check "mempalace==3.12.0"
          mempalace --help > /dev/null
      - name: Install Ollama local inference engine
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/mempalace-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags > /dev/null
      - name: Download both genuine model weights
        run: |
          ollama pull qwen2.5:0.5b
          ollama pull smollm2:135m
          ollama list
      - name: Execute real complementary-knowledge collaboration gate
        id: collaboration
        continue-on-error: true
        run: |
          python experiments/mempalace/knowledge_collaboration.py \
            --model-a qwen2.5:0.5b --model-b smollm2:135m \
            --report mempalace-collaboration.json
      - name: Execute real shared-memory recall gate
        id: recall
        continue-on-error: true
        run: |
          python experiments/mempalace/tomb_relocation.py \
            --model-a qwen2.5:0.5b --model-b smollm2:135m \
            --report mempalace-result.json
      - name: Preserve bounded evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mempalace-real-llm-${{ github.run_id }}
          path: |
            mempalace-result.json
            mempalace-collaboration.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce both live evidence gates
        if: always()
        run: |
          test "${{ steps.collaboration.outcome }}" = "success"
          test "${{ steps.recall.outcome }}" = "success"
