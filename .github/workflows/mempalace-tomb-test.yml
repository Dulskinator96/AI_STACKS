name: MemPalace tomb memory gate
on:
  workflow_dispatch:
  push:
    branches: [experiment/mempalace-tomb-memory-v1]
    paths:
      - "experiments/mempalace/**"
      - ".github/workflows/mempalace-tomb-test.yml"
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install upstream MemPalace
        run: python -m pip install "mempalace==3.12.0"
      - name: Execute actual memory retrieval experiment
        run: python experiments/mempalace/tomb_relocation.py --report mempalace-result.json
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mempalace-stage1-results
          path: mempalace-result.json
          if-no-files-found: warn
