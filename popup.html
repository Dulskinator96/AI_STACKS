<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: system-ui; font-size: 13px; padding: 12px; margin: 0; background: #1a1a1a; color: #e0e0e0; }
  h2 { margin: 0 0 10px; font-size: 14px; color: #fff; font-weight: 500; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #1D9E75; color: #fff; margin-bottom: 10px; }
  button { width: 100%; padding: 8px; margin-top: 6px; border: 0.5px solid #333; background: #2a2a2a; color: #e0e0e0; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button:hover { background: #333; }
  .status { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.6; }
  .green { color: #1D9E75; }
  #log { font-size: 10px; font-family: monospace; color: #666; margin-top: 8px; max-height: 80px; overflow-y: auto; line-height: 1.6; }
</style>
</head>
<body>
<h2>AI Chat Monitor</h2>
<span class="badge" id="status-badge">Active</span>
<button id="clip-btn">Clip This Chat Now</button>
<button id="view-btn">View Saved Sessions</button>
<button id="open-folder">Open Notes Folder</button>
<div class="status" id="status-text">Monitoring Claude, ChatGPT, Gemini</div>
<div id="log"></div>
<script src="popup.js"></script>
</body>
</html>
